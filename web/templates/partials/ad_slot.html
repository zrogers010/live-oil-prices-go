{{define "ad_slot"}}
{{if $.PageData.AdSenseClient}}
<div class="ad-slot" style="margin: 2rem auto; max-width: {{.MaxWidth}}; min-height: {{.MinHeight}}; display: flex; align-items: center; justify-content: center; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 1rem;">
    {{if .SlotID}}
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{$.PageData.AdSenseClient}}"
         data-ad-slot="{{.SlotID}}"
         data-ad-format="{{.Format}}"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    {{else}}
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{$.PageData.AdSenseClient}}"
         data-ad-format="{{.Format}}"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    {{end}}
</div>
{{end}}
{{end}}

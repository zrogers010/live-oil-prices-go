# Pre-certbot template installed by scripts/setup.sh. After certbot adds
# TLS, the live file should look like scripts/nginx-prod.conf.
#
# www.liveoilprices.com is the canonical host. The apex 301s to it,
# keeping path and query string. The redirect sits in "location /" (not at
# server level) so the exact-match ACME challenge locations certbot inserts
# still win.
server {
    listen 80;
    server_name liveoilprices.com;

    location / {
        return 301 https://www.liveoilprices.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.liveoilprices.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location /css/ {
        alias /home/deploy/liveoilprices/web/static/css/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /js/ {
        alias /home/deploy/liveoilprices/web/static/js/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /robots.txt {
        alias /home/deploy/liveoilprices/web/static/robots.txt;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache_bypass $http_upgrade;
    }
}

# Reference copy of /etc/nginx/conf.d/liveoilprices.conf on prod AFTER the
# apex -> www redirect change and asset versioning fix. It is the live
# certbot-managed file plus edits documented in scripts/NGINX_APEX_REDIRECT.md
# and scripts/NGINX_CACHE_VERSIONING.md.
# deploy.sh does not install this file; apply it by hand per those docs.

# Asset versioning: versioned requests (?v=hash) get long immutable cache,
# unversioned requests get short cache. If this map cannot live in a conf.d
# include (some nginx builds require it at http level in nginx.conf), move
# it there and reference it from this file.
map $arg_v $lop_static_cc {
    default "public, max-age=31536000, immutable";
    ""      "public, max-age=300";
}

# Block any path containing .rollback (e.g. /js.rollback-20261017b/app.js)
location ~ \.rollback {
    return 404;
}

server {
    server_name www.liveoilprices.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location /css/ {
        alias /home/deploy/liveoilprices/web/static/css/;
        add_header Cache-Control $lop_static_cc always;
        access_log off;
    }

    location /js/ {
        alias /home/deploy/liveoilprices/web/static/js/;
        add_header Cache-Control $lop_static_cc always;
        access_log off;
    }

    location /robots.txt {
        alias /home/deploy/liveoilprices/web/static/robots.txt;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/liveoilprices.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/liveoilprices.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
# Apex -> www. Same certificate (its SAN list covers both names).
# The redirect lives in "location /" rather than at server level so the
# exact-match ACME challenge locations certbot inserts during renewal
# still take priority over it. $request_uri keeps path and query string.
server {
    listen 443 ssl;
    server_name liveoilprices.com;

    ssl_certificate /etc/letsencrypt/live/liveoilprices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liveoilprices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.liveoilprices.com$request_uri;
    }
}
server {
    if ($host = www.liveoilprices.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = liveoilprices.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name liveoilprices.com www.liveoilprices.com;
    return 404; # managed by Certbot




}
# Live Oil Prices nginx configuration
# This file should be deployed to /etc/nginx/conf.d/liveoilprices.conf
#
# After updating this file on the server:
#   sudo nginx -t           # Test configuration
#   sudo systemctl reload nginx   # Apply changes

upstream liveoilprices_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limit zone for API endpoints (optional protection against hot loops)
# Allows 10 requests per second per IP, with burst of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name liveoilprices.com www.liveoilprices.com;

    # Redirect HTTP to HTTPS (assuming SSL is configured)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liveoilprices.com www.liveoilprices.com;

    # SSL configuration (paths will vary - adjust to your setup)
    # ssl_certificate /etc/letsencrypt/live/liveoilprices.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/liveoilprices.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block .rollback paths
    location ~ /\.rollback {
        return 404;
    }

    # Versioned static assets (?v= query param) get long immutable cache
    # The Go app computes content hashes and adds ?v=<hash> to URLs
    location ~ ^/(js|css|images|fonts)/.+\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://liveoilprices_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Check if request has version query param
        set $cache_control "max-age=300, public";
        if ($args ~* "v=") {
            set $cache_control "max-age=31536000, public, immutable";
        }
        add_header Cache-Control $cache_control always;
    }

    # API endpoints with optional rate limiting
    # Uncomment limit_req to enable per-IP rate limiting
    location ~ ^/api/(charts|hero)/ {
        # Uncomment to enable rate limiting (10 req/s per IP, burst 20)
        # limit_req zone=api_limit burst=20 nodelay;
        # limit_req_status 429;
        # add_header Retry-After "10" always;

        proxy_pass http://liveoilprices_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API responses shouldn't be cached by browsers
        add_header Cache-Control "no-cache" always;
    }

    # All other API endpoints
    location /api/ {
        proxy_pass http://liveoilprices_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache" always;
    }

    # HTML pages and all other requests
    location / {
        proxy_pass http://liveoilprices_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML pages get no-cache so browsers pick up new script URLs
        add_header Cache-Control "no-cache" always;
    }

    # Access and error logs
    access_log /var/log/nginx/liveoilprices_access.log;
    error_log /var/log/nginx/liveoilprices_error.log;
}
